<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    The Celestial Archive
</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    background:
        #070914;

    color:
        #eeeaff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    overflow-x:
        hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {

    content:
        "";

    position:
        fixed;

    inset:
        0;

    pointer-events:
        none;

    opacity:
        0.45;

    background-image:

        radial-gradient(
            circle,
            white 0 1px,
            transparent 1.5px
        );

    background-size:
        90px 90px;
}


/* =====================================================
   ARCHIVE
===================================================== */

.archive {

    min-height:
        100vh;

    padding:
        28px 24px 35px;

    background:

        radial-gradient(
            circle at center,
            rgba(93,82,155,0.16),
            transparent 48%
        ),

        #070914;
}


/* =====================================================
   HEADER
===================================================== */

header {

    text-align:
        center;
}

.kicker {

    font-family:
        Arial,
        sans-serif;

    font-size:
        10px;

    letter-spacing:
        4px;

    text-transform:
        uppercase;

    opacity:
        0.5;
}

h1 {

    margin:
        9px 0 4px;

    font-size:
        clamp(
            30px,
            4vw,
            52px
        );

    font-weight:
        normal;

    letter-spacing:
        7px;
}

.subtitle {

    font-size:
        13px;

    font-style:
        italic;

    opacity:
        0.55;
}


/* =====================================================
   CYCLE NAVIGATION
===================================================== */

.cycle-navigation {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    gap:
        16px;

    margin:
        22px auto 10px;
}

.nav-button {

    width:
        34px;

    height:
        34px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.18
        );

    background:
        rgba(
            255,
            255,
            255,
            0.04
        );

    color:
        white;

    cursor:
        pointer;

    font-size:
        19px;
}

.nav-button:hover {

    background:
        rgba(
            255,
            255,
            255,
            0.1
        );
}

.cycle-title {

    min-width:
        230px;

    text-align:
        center;
}

.cycle-title strong {

    display:
        block;

    font-size:
        18px;

    font-weight:
        normal;

    letter-spacing:
        4px;
}

.cycle-title span {

    display:
        block;

    margin-top:
        4px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        9px;

    letter-spacing:
        2.5px;

    opacity:
        0.4;

    text-transform:
        uppercase;
}


/* =====================================================
   MONTH TABS
===================================================== */

.month-tabs {

    display:
        flex;

    justify-content:
        center;

    gap:
        7px;

    margin:
        15px auto 12px;

    flex-wrap:
        wrap;
}

.month-tab {

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.09
        );

    background:
        rgba(
            255,
            255,
            255,
            0.025
        );

    color:
        rgba(
            255,
            255,
            255,
            0.45
        );

    padding:
        7px 13px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        9px;

    letter-spacing:
        2px;

    text-transform:
        uppercase;

    cursor:
        pointer;

    transition:
        0.2s ease;
}

.month-tab:hover {

    background:
        rgba(
            255,
            255,
            255,
            0.07
        );
}

.month-tab.active {

    color:
        white;

    background:
        rgba(
            255,
            255,
            255,
            0.09
        );

    border-color:
        rgba(
            255,
            255,
            255,
            0.25
        );
}


/* =====================================================
   MAP
===================================================== */

.map-container {

    width:
        min(
            1100px,
            94vw
        );

    aspect-ratio:
        16 / 9;

    margin:
        0 auto;

    position:
        relative;
}

.map {

    position:
        absolute;

    inset:
        0;

    overflow:
        hidden;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.08
        );

    border-radius:
        18px;

    background:

        radial-gradient(
            ellipse at center,
            rgba(
                100,
                90,
                160,
                0.12
            ),
            transparent 62%
        );
}


/* =====================================================
   DECORATIVE ORBITAL RINGS
===================================================== */

.map::before {

    content:
        "";

    position:
        absolute;

    width:
        72%;

    height:
        72%;

    left:
        14%;

    top:
        14%;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.035
        );

    border-radius:
        50%;

    transform:
        rotate(18deg);

    pointer-events:
        none;
}

.map::after {

    content:
        "";

    position:
        absolute;

    width:
        48%;

    height:
        48%;

    left:
        26%;

    top:
        26%;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.025
        );

    border-radius:
        50%;

    transform:
        rotate(-25deg);

    pointer-events:
        none;
}


/* =====================================================
   MONTH TITLE
===================================================== */

.map-month-title {

    position:
        absolute;

    top:
        22px;

    left:
        28px;

    z-index:
        5;

    font-family:
        Arial,
        sans-serif;

    font-size:
        10px;

    letter-spacing:
        4px;

    opacity:
        0.38;

    text-transform:
        uppercase;
}


/* =====================================================
   SVG
===================================================== */

svg {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    overflow:
        visible;

    z-index:
        3;
}


/* =====================================================
   CONSTELLATION LINES
===================================================== */

.constellation-line {

    stroke:
        rgba(
            220,
            215,
            255,
            0.36
        );

    stroke-width:
        1.25;

    stroke-dasharray:
        3 5;

    vector-effect:
        non-scaling-stroke;

    pointer-events:
        stroke;

    cursor:
        pointer;

    transition:
        0.15s ease;
}

.editing .constellation-line:hover {

    stroke:
        rgba(
            255,
            255,
            255,
            0.95
        );

    stroke-width:
        2;
}


/* =====================================================
   STAR
===================================================== */

.star {

    transform-box:
        fill-box;

    transform-origin:
        center;

    cursor:
        pointer;

    transition:
        filter
        0.15s
        ease;
}

.star:hover {

    filter:

        drop-shadow(
            0 0 7px currentColor
        )

        drop-shadow(
            0 0 17px currentColor
        );
}


/* =====================================================
   STAR LABEL
===================================================== */

.star-label {

    font-family:
        Arial,
        sans-serif;

    font-size:
        9px;

    letter-spacing:
        1px;

    fill:
        rgba(
            255,
            255,
            255,
            0.78
        );

    pointer-events:
        none;

    opacity:
        0;

    transition:
        opacity
        0.15s
        ease;
}

.star:hover
.star-label {

    opacity:
        1;
}


/* =====================================================
   EDITOR
===================================================== */

.editor-panel {

    display:
        none;

    width:
        min(
            1100px,
            94vw
        );

    margin:
        12px auto 0;

    padding:
        12px 14px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.12
        );

    background:
        rgba(
            255,
            255,
            255,
            0.035
        );

    border-radius:
        10px;

    font-family:
        Arial,
        sans-serif;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    flex-wrap:
        wrap;
}

.editor-panel.active {

    display:
        flex;
}

.editor-status {

    font-size:
        9px;

    letter-spacing:
        1.5px;

    opacity:
        0.65;

    text-transform:
        uppercase;
}

.editor-hint {

    font-size:
        9px;

    opacity:
        0.38;

    margin-top:
        4px;
}

.editor-buttons {

    display:
        flex;

    gap:
        6px;

    flex-wrap:
        wrap;
}

.editor-button {

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.15
        );

    background:
        rgba(
            255,
            255,
            255,
            0.06
        );

    color:
        white;

    padding:
        7px 12px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        9px;

    letter-spacing:
        1px;

    cursor:
        pointer;
}

.editor-button:hover {

    background:
        rgba(
            255,
            255,
            255,
            0.12
        );
}

.editor-button.active {

    background:
        rgba(
            120,
            170,
            255,
            0.16
        );

    border-color:
        rgba(
            150,
            190,
            255,
            0.4
        );
}

.editing .star {

    cursor:
        grab;
}

.editing .star:active {

    cursor:
        grabbing;
}

.selected-star {

    filter:

        drop-shadow(
            0 0 7px white
        )

        drop-shadow(
            0 0 18px currentColor
        );
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position:
        fixed;

    inset:
        0;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(
            3,
            4,
            10,
            0.82
        );

    backdrop-filter:
        blur(8px);

    z-index:
        100;
}

.modal.active {

    display:
        flex;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

    width:
        min(
            720px,
            94vw
        );

    display:
        grid;

    grid-template-columns:
        230px 1fr;

    position:
        relative;

    background:

        linear-gradient(
            135deg,
            #121426,
            #090b15
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.15
        );

    box-shadow:
        0 30px 100px
        rgba(
            0,
            0,
            0,
            0.6
        );
}


/* =====================================================
   PORTRAIT
===================================================== */

.portrait {

    min-height:
        310px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        hidden;

    background:

        radial-gradient(
            circle,
            rgba(
                120,
                110,
                190,
                0.2
            ),
            transparent 60%
        ),

        #101321;

    font-family:
        Arial,
        sans-serif;

    font-size:
        9px;

    letter-spacing:
        2px;

    color:
        rgba(
            255,
            255,
            255,
            0.35
        );
}

.portrait img {

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    display:
        none;
}

.portrait.has-image
img {

    display:
        block;
}

.portrait.has-image
.portrait-placeholder {

    display:
        none;
}


/* =====================================================
   PROFILE CONTENT
===================================================== */

.profile-content {

    padding:
        40px;
}

.close {

    position:
        absolute;

    right:
        14px;

    top:
        9px;

    border:
        none;

    background:
        none;

    color:
        white;

    font-size:
        24px;

    opacity:
        0.55;

    cursor:
        pointer;
}

.rank {

    font-family:
        Arial,
        sans-serif;

    font-size:
        9px;

    letter-spacing:
        2px;

    opacity:
        0.45;

    text-transform:
        uppercase;
}

.profile h2 {

    margin:
        9px 0 17px;

    font-size:
        30px;

    font-weight:
        normal;

    letter-spacing:
        2px;
}

.profile-info {

    font-family:
        Arial,
        sans-serif;

    font-size:
        11px;

    line-height:
        1.9;

    opacity:
        0.65;
}

.quote {

    margin-top:
        23px;

    padding-top:
        16px;

    border-top:
        1px solid
        rgba(
            255,
            255,
            255,
            0.08
        );

    font-style:
        italic;

    font-size:
        13px;

    opacity:
        0.6;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:650px) {

    .archive {

        padding:
            22px 12px 30px;
    }

    .month-tab {

        padding:
            6px 9px;

        font-size:
            8px;
    }

    .profile {

        grid-template-columns:
            1fr;
    }

    .portrait {

        min-height:
            190px;

        max-height:
            240px;
    }

    .profile-content {

        padding:
            28px;
    }

}

</style>

</head>


<body>

            name:
                student.name,

            x:
                student.x,

            y:
                student.y

        })
    );


/* =====================================================
   EDIT MODE
===================================================== */

const editMode =

    new URLSearchParams(
        window.location.search
    ).get("edit") === "true";


let addingLine =
    false;


let selectedStar =
    null;


let draggedStar =
    null;


/* =====================================================
   DOM
===================================================== */

const svg =
    document.getElementById(
        "constellation"
    );


const monthTabs =
    document.getElementById(
        "month-tabs"
    );


const mapMonthTitle =
    document.getElementById(
        "map-month-title"
    );


const editorPanel =
    document.getElementById(
        "editor-panel"
    );


const addLineButton =
    document.getElementById(
        "add-line"
    );


if (editMode) {

    document.body.classList.add(
        "editing"
    );

    editorPanel.classList.add(
        "active"
    );

}


/* =====================================================
   DRAW CONSTELLATION
===================================================== */

function drawConstellation() {

    svg.innerHTML = "";


    const monthStudents =

        students.filter(
            student =>
                student.month ===
                currentMonth
        );


    const studentMap =
        new Map();


    monthStudents.forEach(
        student => {

            studentMap.set(
                student.name,
                student
            );

        }
    );


    const lines =

        constellationLines[
            currentMonth
        ] || [];


    /* =================================================
       DRAW LINES
    ================================================= */

    lines.forEach(
        (connection, index) => {


            const studentA =
                studentMap.get(
                    connection[0]
                );


            const studentB =
                studentMap.get(
                    connection[1]
                );


            if (
                !studentA ||
                !studentB
            ) {

                return;

            }


            const line =

                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                studentA.x
            );


            line.setAttribute(
                "y1",
                studentA.y
            );


            line.setAttribute(
                "x2",
                studentB.x
            );


            line.setAttribute(
                "y2",
                studentB.y
            );


            line.setAttribute(
                "class",
                "constellation-line"
            );


            if (editMode) {

                line.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        constellationLines[
                            currentMonth
                        ].splice(
                            index,
                            1
                        );


                        drawConstellation();

                    }
                );

            }


            svg.appendChild(
                line
            );

        }
    );


    /* =================================================
       DRAW STARS
    ================================================= */

    monthStudents.forEach(
        student => {


            const group =

                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );


            group.setAttribute(
                "class",
                "star"
            );


            group.style.color =

                stellarColors[
                    student.type
                ];


            group.setAttribute(
                "transform",
                `translate(
                    ${student.x},
                    ${student.y}
                )`
            );


            /* =================================================
               GLOW
            ================================================= */

            const glow =

                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            const glowRadius =

                student.rank === 1
                    ? 19
                    : student.rank === 2
                    ? 15
                    : student.rank === 3
                    ? 13
                    : 8;


            glow.setAttribute(
                "r",
                glowRadius
            );


            glow.setAttribute(
                "fill",
                stellarColors[
                    student.type
                ]
            );


            glow.setAttribute(
                "opacity",
                student.rank
                    ? "0.17"
                    : "0.055"
            );


            /* =================================================
               ACTUAL STAR
            ================================================= */

            const star =

                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            const starRadius =

                student.rank === 1
                    ? 8
                    : student.rank === 2
                    ? 6.5
                    : student.rank === 3
                    ? 5.5
                    : 3.3;


            star.setAttribute(
                "r",
                starRadius
            );


            star.setAttribute(
                "fill",
                stellarColors[
                    student.type
                ]
            );


            star.setAttribute(
                "stroke",
                "rgba(255,255,255,0.85)"
            );


            star.setAttribute(
                "stroke-width",
                "1"
            );


            /* =================================================
               HOVER NAME
            ================================================= */

            const label =

                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "text"
                );


            label.setAttribute(
                "class",
                "star-label"
            );


            label.setAttribute(
                "x",
                "11"
            );


            label.setAttribute(
                "y",
                "3"
            );


            label.textContent =
                student.name;


            group.appendChild(
                glow
            );


            group.appendChild(
                star
            );


            group.appendChild(
                label
            );


            /* =================================================
               DRAGGING
            ================================================= */

            if (editMode) {

                setupDragging(
                    group,
                    student
                );

            }


            /* =================================================
               CLICK
            ================================================= */

            group.addEventListener(
                "click",
                event => {


                    event.stopPropagation();


                    if (editMode) {

                        if (
                            addingLine
                        ) {

                            selectStarForLine(
                                student,
                                group
                            );

                        }

                        return;

                    }


                    openProfile(
                        student
                    );

                }
            );


            svg.appendChild(
                group
            );

        }
    );

}


/* =====================================================
   DRAGGING
===================================================== */

function setupDragging(
    group,
    student
) {


    group.addEventListener(
        "pointerdown",
        event => {


            if (
                addingLine
            ) {

                return;

            }


            event.preventDefault();


            draggedStar =
                student;


            group.setPointerCapture(
                event.pointerId
            );

        }
    );


    group.addEventListener(
        "pointermove",
        event => {


            if (
                draggedStar !==
                student
            ) {

                return;

            }


            const rect =
                svg.getBoundingClientRect();


            let x =

                (
                    event.clientX -
                    rect.left
                )
                *
                (
                    1000 /
                    rect.width
                );


            let y =

                (
                    event.clientY -
                    rect.top
                )
                *
                (
                    562.5 /
                    rect.height
                );


            x =
                Math.max(
                    20,
                    Math.min(
                        980,
                        x
                    )
                );


            y =
                Math.max(
                    20,
                    Math.min(
                        542,
                        y
                    )
                );


            student.x =
                Math.round(
                    x
                );


            student.y =
                Math.round(
                    y
                );


            /*
               Move ONLY this star.
               Tidak redraw SVG.
            */

            group.setAttribute(
                "transform",
                `translate(
                    ${student.x},
                    ${student.y}
                )`
            );


            updateConnectedLines(
                student
            );

        }
    );


    group.addEventListener(
        "pointerup",
        event => {


            draggedStar =
                null;


            try {

                group.releasePointerCapture(
                    event.pointerId
                );

            } catch (error) {}

        }
    );


    group.addEventListener(
        "pointercancel",
        () => {

            draggedStar =
                null;

        }
    );

}


/* =====================================================
   UPDATE CONNECTED LINES
===================================================== */

function updateConnectedLines(
    movedStudent
) {


    const lines =
        constellationLines[
            currentMonth
        ] || [];


    const svgLines =
        svg.querySelectorAll(
            ".constellation-line"
        );


    lines.forEach(
        (connection, index) => {


            if (

                connection[0] !==
                    movedStudent.name &&

                connection[1] !==
                    movedStudent.name

            ) {

                return;

            }


            const line =
                svgLines[
                    index
                ];


            if (!line) {

                return;

            }


            const studentA =
                students.find(
                    student =>
                        student.name ===
                        connection[0]
                );


            const studentB =
                students.find(
                    student =>
                        student.name ===
                        connection[1]
                );


            if (
                !studentA ||
                !studentB
            ) {

                return;

            }


            line.setAttribute(
                "x1",
                studentA.x
            );


            line.setAttribute(
                "y1",
                studentA.y
            );


            line.setAttribute(
                "x2",
                studentB.x
            );


            line.setAttribute(
                "y2",
                studentB.y
            );

        }
    );

}


/* =====================================================
   ADD LINE
===================================================== */

addLineButton.addEventListener(
    "click",
    () => {


        addingLine =
            !addingLine;


        selectedStar =
            null;


        addLineButton.classList.toggle(
            "active",
            addingLine
        );


        addLineButton.textContent =

            addingLine
                ? "✓ SELECT STARS"
                : "＋ ADD LINE";


        drawConstellation();

    }
);


/* =====================================================
   SELECT STARS FOR LINE
===================================================== */

function selectStarForLine(
    student,
    group
) {


    if (
        !selectedStar
    ) {

        selectedStar =
            student;


        group.classList.add(
            "selected-star"
        );


        return;

    }


    if (
        selectedStar.name ===
        student.name
    ) {

        selectedStar =
            null;


        drawConstellation();

        return;

    }


    if (
        !constellationLines[
            currentMonth
        ]
    ) {

        constellationLines[
            currentMonth
        ] = [];

    }


    const exists =

        constellationLines[
            currentMonth
        ].some(
            connection =>

                (

                    connection[0] ===
                    selectedStar.name &&

                    connection[1] ===
                    student.name

                )

                ||

                (

                    connection[0] ===
                    student.name &&

                    connection[1] ===
                    selectedStar.name

                )
        );


    if (!exists) {

        constellationLines[
            currentMonth
        ].push([

            selectedStar.name,

            student.name

        ]);

    }


    selectedStar =
        null;


    drawConstellation();

}


/* =====================================================
   COPY DATA
===================================================== */

document
    .getElementById(
        "copy-data"
    )
    .addEventListener(
        "click",
        async () => {


            let output =

                `/* ${currentMonth.toUpperCase()} */\n\n`;


            output +=
                "STARS:\n\n";


            students
                .filter(
                    student =>
                        student.month ===
                        currentMonth
                )
                .forEach(
                    student => {


                        output +=

`{
    name: "${student.name}",
    x: ${student.x},
    y: ${student.y}
},

`;

                    }
                );


            output +=
                "\nLINES:\n\n";


            (
                constellationLines[
                    currentMonth
                ] || []
            )
            .forEach(
                line => {


                    output +=

`[
    "${line[0]}",
    "${line[1]}"
],

`;

                }
            );


            try {

                await navigator.clipboard.writeText(
                    output
                );


                alert(
                    "Star positions and constellation lines copied!"
                );


            } catch (error) {

                alert(
                    output
                );

            }

        }
    );


/* =====================================================
   RESET LINES
===================================================== */

document
    .getElementById(
        "reset-lines"
    )
    .addEventListener(
        "click",
        () => {


            constellationLines[
                currentMonth
            ] =

                JSON.parse(
                    JSON.stringify(
                        originalLines[
                            currentMonth
                        ] || []
                    )
                );


            drawConstellation();

        }
    );


/* =====================================================
   RESET EVERYTHING
===================================================== */

document
    .getElementById(
        "reset-editor"
    )
    .addEventListener(
        "click",
        () => {


            originalPositions.forEach(
                original => {


                    const student =
                        students.find(
                            item =>
                                item.name ===
                                original.name
                        );


                    if (student) {

                        student.x =
                            original.x;

                        student.y =
                            original.y;

                    }

                }
            );


            Object.keys(
                originalLines
            ).forEach(
                month => {


                    constellationLines[
                        month
                    ] =

                        JSON.parse(
                            JSON.stringify(
                                originalLines[
                                    month
                                ]
                            )
                        );

                }
            );


            drawConstellation();

        }
    );


/* =====================================================
   MONTH TABS
===================================================== */

function renderMonthTabs() {


    monthTabs.innerHTML =
        "";


    const cycle =
        cycles[
            currentCycle
        ];


    cycle.months.forEach(
        month => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "month-tab";


            if (
                month ===
                currentMonth
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                month;


            button.addEventListener(
                "click",
                () => {


                    currentMonth =
                        month;


                    renderMonthTabs();


                    updateMonthTitle();


                    drawConstellation();

                }
            );


            monthTabs.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   MONTH TITLE
===================================================== */

function updateMonthTitle() {


    if (
        currentMonth ===
        "June"
    ) {

        mapMonthTitle.textContent =
            "June · Ursa Minor";

    } else {

        mapMonthTitle.textContent =
            currentMonth;

    }

}


/* =====================================================
   PROFILE
===================================================== */

const modal =
    document.getElementById(
        "modal"
    );


function openProfile(
    student
) {


    document.getElementById(
        "profile-name"
    ).textContent =
        student.name;


    document.getElementById(
        "profile-rank"
    ).textContent =

        student.rank

            ? `Rank #${String(
                student.rank
            ).padStart(
                2,
                "0"
            )} · ${student.month} 2026`

            : `Recorded Star · ${student.month} 2026`;


    const portrait =
        document.getElementById(
            "portrait"
        );


    const image =
        document.getElementById(
            "portrait-image"
        );


    /* =================================================
       RANK 0
       NO PHOTO
       DATA ONLY
    ================================================= */

    if (
        student.rank === 0
    ) {


        portrait.classList.remove(
            "has-image"
        );


        image.removeAttribute(
            "src"
        );


        document.getElementById(
            "profile-info"
        ).textContent =
            student.identity;


        document.getElementById(
            "profile-quote"
        ).textContent =
            "";


        modal.classList.add(
            "active"
        );


        return;

    }


    /* =================================================
       RANK 1–3
       PHOTO + DATA
    ================================================= */

    document.getElementById(
        "profile-info"
    ).textContent =
        student.identity;


    document.getElementById(
        "profile-quote"
    ).textContent =
        `“${student.quote}”`;


    portrait.classList.remove(
        "has-image"
    );


    image.removeAttribute(
        "src"
    );


    if (
        student.photo
    ) {


        image.onload =
            () => {

                portrait.classList.add(
                    "has-image"
                );

            };


        image.onerror =
            () => {

                portrait.classList.remove(
                    "has-image"
                );

            };


        image.src =
            student.photo;

    }


    modal.classList.add(
        "active"
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

document
    .getElementById(
        "close"
    )
    .addEventListener(
        "click",
        () => {

            modal.classList.remove(
                "active"
            );

        }
    );


modal.addEventListener(
    "click",
    event => {


        if (
            event.target ===
            modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================================
   CYCLE NAVIGATION
===================================================== */

document
    .getElementById(
        "previous"
    )
    .addEventListener(
        "click",
        () => {


            if (
                currentCycle > 0
            ) {


                currentCycle--;


                currentMonth =
                    cycles[
                        currentCycle
                    ].months[0];


                updateCycle();

            }

        }
    );


document
    .getElementById(
        "next"
    )
    .addEventListener(
        "click",
        () => {


            if (
                currentCycle <
                cycles.length - 1
            ) {


                currentCycle++;


                currentMonth =
                    cycles[
                        currentCycle
                    ].months[0];


                updateCycle();

            }

        }
    );


function updateCycle() {


    const cycle =
        cycles[
            currentCycle
        ];


    document.getElementById(
        "cycle-name"
    ).textContent =
        cycle.name;


    document.getElementById(
        "cycle-date"
    ).textContent =
        cycle.date;


    renderMonthTabs();


    updateMonthTitle();


    drawConstellation();

}


/* =====================================================
   EXIT EDITOR
===================================================== */

document
    .getElementById(
        "exit-editor"
    )
    .addEventListener(
        "click",
        () => {


            const url =
                new URL(
                    window.location.href
                );


            url.searchParams.delete(
                "edit"
            );


            window.location.href =
                url.toString();

        }
    );


/* =====================================================
   INITIALIZE
===================================================== */

updateCycle();


</script>
