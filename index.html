<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Celestial Archive</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070914;
    color: #eeeaff;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.45;

    background-image:
        radial-gradient(circle, white 0 1px, transparent 1.5px);

    background-size: 90px 90px;
}


/* =====================================================
   MAIN
===================================================== */

.archive {
    min-height: 100vh;

    padding:
        35px
        30px
        50px;

    background:
        radial-gradient(
            circle at center,
            rgba(93, 82, 155, 0.18),
            transparent 50%
        ),
        #070914;
}


/* =====================================================
   HEADER
===================================================== */

header {
    text-align: center;
}

.kicker {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    opacity: 0.5;
}

h1 {
    margin: 10px 0 5px;

    font-size:
        clamp(32px, 5vw, 58px);

    font-weight: normal;

    letter-spacing: 8px;
}

.subtitle {
    font-size: 14px;

    font-style: italic;

    opacity: 0.6;
}


/* =====================================================
   CYCLE NAVIGATION
===================================================== */

.cycle-navigation {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    margin:
        28px auto
        12px;
}

.nav-button {

    width: 36px;
    height: 36px;

    flex-shrink: 0;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,0.2);

    background:
        rgba(255,255,255,0.04);

    color: white;

    cursor: pointer;

    font-size: 19px;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.nav-button:hover {

    background:
        rgba(255,255,255,0.12);

    transform:
        scale(1.05);
}

.cycle-title {

    min-width: 230px;

    text-align: center;
}

.cycle-title strong {

    display: block;

    font-size: 19px;

    font-weight: normal;

    letter-spacing: 4px;
}

.cycle-title span {

    display: block;

    margin-top: 5px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    opacity: 0.4;

    text-transform: uppercase;
}


/* =====================================================
   MONTH SUB TABS
===================================================== */

.month-tabs {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 4px;

    margin:
        0 auto
        24px;

    width: fit-content;

    padding: 4px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 30px;

    background:
        rgba(255,255,255,0.025);
}

.month-tab {

    border: none;

    background: transparent;

    color: rgba(255,255,255,0.4);

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    padding:
        8px 14px;

    border-radius: 20px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.month-tab:hover {

    color:
        rgba(255,255,255,0.8);
}

.month-tab.active {

    background:
        rgba(255,255,255,0.1);

    color: white;
}


/* =====================================================
   MONTH TITLE
===================================================== */

.month-display {

    text-align: center;

    margin-bottom: 12px;
}

.month-display h2 {

    margin: 0;

    font-size: 25px;

    font-weight: normal;

    letter-spacing: 6px;
}

.month-display p {

    margin:
        5px 0 0;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    opacity: 0.35;

    text-transform: uppercase;
}


/* =====================================================
   SKY MAP
===================================================== */

.map-container {

    width:
        min(920px, 92vw);

    aspect-ratio:
        16 / 9;

    margin:
        0 auto;

    position: relative;
}

.map {

    position: absolute;

    inset: 0;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 20px;

    background:

        radial-gradient(
            ellipse at center,
            rgba(100,90,160,0.13),
            transparent 62%
        ),

        radial-gradient(
            circle at 20% 30%,
            rgba(100,130,210,0.05),
            transparent 25%
        ),

        #090c19;
}


/* =====================================================
   CELESTIAL RINGS
===================================================== */

.map::before {

    content: "";

    position: absolute;

    width: 75%;
    height: 90%;

    left: 12.5%;
    top: 5%;

    border:
        1px solid
        rgba(255,255,255,0.035);

    border-radius: 50%;

    transform:
        rotate(8deg);
}

.map::after {

    content: "";

    position: absolute;

    width: 50%;
    height: 70%;

    left: 25%;
    top: 15%;

    border:
        1px solid
        rgba(255,255,255,0.025);

    border-radius: 50%;

    transform:
        rotate(-18deg);
}


/* =====================================================
   MONTH CORNER
===================================================== */

.month-corner {

    position: absolute;

    left: 24px;
    top: 20px;

    z-index: 5;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    opacity: 0.3;

    text-transform: uppercase;
}


/* =====================================================
   SVG
===================================================== */

svg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 3;

    overflow: visible;

    touch-action: none;
}


/* =====================================================
   CONSTELLATION LINES
===================================================== */

.constellation-line {

    stroke:
        rgba(210,220,255,0.3);

    stroke-width:
        1.1;

    stroke-dasharray:
        3 6;

    fill: none;

    pointer-events: none;

    transition:
        stroke 0.15s ease,
        stroke-width 0.15s ease;
}

.constellation-line.major {

    stroke:
        rgba(225,230,255,0.5);

    stroke-width:
        1.5;

    stroke-dasharray:
        none;
}


/*
   EDITOR MODE:
   Lines become clickable.
*/

body.editor-mode .constellation-line {

    pointer-events: stroke;

    cursor: pointer;
}

body.editor-mode .constellation-line:hover {

    stroke:
        rgba(255,255,255,0.9);

    stroke-width:
        3;
}


/* =====================================================
   STAR GROUP
===================================================== */

.star {

    cursor: pointer;

    transform-box:
        fill-box;

    transform-origin:
        center;

    outline: none;

    touch-action: none;
}


/* =====================================================
   STAR VISUAL PARTS
===================================================== */

.star-core,
.star-glow,
.star-flare {

    transition:
        r 0.18s ease,
        opacity 0.18s ease,
        stroke-width 0.18s ease;
}


/* =====================================================
   HOVER
===================================================== */

.star:hover .star-core {

    stroke-width:
        2;
}

.star:hover .star-glow {

    opacity:
        0.3;
}

.star:hover .star-flare {

    opacity:
        0.7;
}


/* =====================================================
   EDITOR STAR
===================================================== */

body.editor-mode .star {

    cursor:
        grab;
}

body.editor-mode .star.dragging {

    cursor:
        grabbing;
}

body.editor-mode .star.selected-line-star .star-core {

    stroke:
        white;

    stroke-width:
        3;
}

body.editor-mode .star.selected-line-star .star-glow {

    opacity:
        0.45;
}


/* =====================================================
   RANK 0
===================================================== */

.recorded-star {

    opacity:
        0.75;
}

.recorded-star:hover {

    opacity:
        1;
}


/* =====================================================
   EMPTY MONTH
===================================================== */

.empty-month {

    position: absolute;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 2;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    color:
        rgba(255,255,255,0.25);
}


/* =====================================================
   TOOLTIP
===================================================== */

.star-tooltip {

    position: fixed;

    z-index: 200;

    width: 230px;

    padding: 13px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(20,23,42,0.97),
            rgba(8,10,20,0.97)
        );

    border:
        1px solid
        rgba(255,255,255,0.14);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,0.55);

    backdrop-filter:
        blur(10px);

    opacity: 0;

    transform:
        translateY(5px);

    transition:
        opacity 0.12s ease,
        transform 0.12s ease;
}

.star-tooltip.visible {

    opacity: 1;

    transform:
        translateY(0);
}

.star-tooltip.simple {

    width:
        210px;
}

.tooltip-photo {

    width: 100%;

    height: 125px;

    object-fit: cover;

    display: block;

    margin-bottom: 11px;

    background:
        #101321;
}

.tooltip-rank {

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: 0.45;

    margin-bottom: 4px;
}

.tooltip-name {

    font-size: 17px;

    letter-spacing: 1px;

    margin-bottom: 4px;
}

.tooltip-identity {

    font-family: Arial, sans-serif;

    font-size: 10px;

    line-height: 1.5;

    opacity: 0.55;
}


/* =====================================================
   EDITOR PANEL
===================================================== */

.editor-panel {

    display: none;

    width:
        min(920px, 92vw);

    margin:
        15px auto
        0;

    padding:
        12px 14px;

    align-items: center;

    justify-content: center;

    gap: 7px;

    flex-wrap: wrap;

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius: 12px;

    background:
        rgba(10,13,27,0.92);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.3);

    font-family: Arial, sans-serif;
}

body.editor-mode .editor-panel {

    display: flex;
}

.editor-label {

    margin-right: 5px;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;

    opacity: 0.4;
}

.editor-button {

    border:
        1px solid
        rgba(255,255,255,0.12);

    background:
        rgba(255,255,255,0.04);

    color:
        rgba(255,255,255,0.75);

    padding:
        7px 11px;

    border-radius: 7px;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
}

.editor-button:hover {

    background:
        rgba(255,255,255,0.1);

    color:
        white;
}

.editor-button.active {

    background:
        rgba(120,140,255,0.18);

    border-color:
        rgba(160,175,255,0.4);

    color:
        white;
}

.editor-button.danger:hover {

    background:
        rgba(255,80,80,0.12);

    border-color:
        rgba(255,120,120,0.3);
}

.editor-status {

    width: 100%;

    text-align: center;

    font-size: 8px;

    letter-spacing: 1.5px;

    color:
        rgba(255,255,255,0.35);

    margin-top: 2px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(3,4,10,0.82);

    backdrop-filter:
        blur(8px);

    z-index: 100;
}

.modal.active {

    display: flex;
}


/* =====================================================
   PROFILE
===================================================== */

.profile {

    width:
        min(720px, 95vw);

    display: grid;

    grid-template-columns:
        230px 1fr;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #121426,
            #090b15
        );

    border:
        1px solid
        rgba(255,255,255,0.15);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,0.6);
}


/* =====================================================
   PORTRAIT
===================================================== */

.portrait {

    min-height:
        310px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(120,110,190,0.2),
            transparent 60%
        ),
        #101321;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,0.35);
}

.portrait img {

    width: 100%;
    height: 100%;

    min-height:
        310px;

    object-fit: cover;
}


/* =====================================================
   PROFILE CONTENT
===================================================== */

.profile-content {

    padding:
        40px;
}

.close {

    position: absolute;

    right: 14px;
    top: 8px;

    border: none;

    background: none;

    color: white;

    font-size: 24px;

    opacity: 0.6;

    cursor: pointer;
}

.rank {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    opacity: 0.5;

    text-transform: uppercase;
}

.profile h2 {

    margin:
        9px 0;

    font-size: 29px;

    font-weight: normal;

    letter-spacing: 3px;
}

.profile-info {

    font-family: Arial, sans-serif;

    font-size: 11px;

    line-height: 2;

    opacity: 0.65;
}

.quote {

    margin-top:
        22px;

    padding-top:
        16px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);

    font-style: italic;

    opacity: 0.65;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 650px) {

    .archive {

        padding:
            25px 12px 35px;
    }

    .month-tabs {

        max-width:
            100%;

        overflow-x:
            auto;

        justify-content:
            flex-start;
    }

    .month-tab {

        flex-shrink: 0;

        padding:
            8px 11px;
    }

    .map-container {

        width:
            100%;

        aspect-ratio:
            16 / 10;
    }

    .profile {

        grid-template-columns:
            1fr;
    }

    .portrait,
    .portrait img {

        min-height:
            200px;
    }

    .profile-content {

        padding:
            28px;
    }

}

</style>
</head>

        JSON.stringify(students)
    );


const originalLines = {

    June: [

        [0, 1, true],
        [1, 2, true],

        [6, 0, false],
        [3, 0, false],

        [0, 4, false],
        [4, 5, false],
        [5, 7, false],

        [1, 5, false],
        [5, 6, false],
        [6, 2, false],

        [2, 7, false]

    ]

};


/* =====================================================
   ACTIVE CONSTELLATION CONNECTIONS
===================================================== */

let constellationLines =
    JSON.parse(
        JSON.stringify(originalLines)
    );


/* =====================================================
   LOCAL STORAGE
===================================================== */

const STORAGE_KEY =
    "celestialArchiveEditor";


function saveEditorData() {

    const data = {

        students:
            students.map(
                student => ({
                    x: student.x,
                    y: student.y
                })
            ),

        lines:
            constellationLines

    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function loadEditorData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return;

    }


    try {

        const data =
            JSON.parse(saved);


        if (
            data.students &&
            Array.isArray(data.students)
        ) {

            data.students.forEach(
                (position, index) => {

                    if (
                        students[index] &&
                        typeof position.x === "number" &&
                        typeof position.y === "number"
                    ) {

                        students[index].x =
                            position.x;

                        students[index].y =
                            position.y;

                    }

                }
            );

        }


        if (data.lines) {

            constellationLines =
                data.lines;

        }

    } catch (error) {

        console.warn(
            "Could not load editor data.",
            error
        );

    }

}

   ELEMENTS
===================================================== */

const svg =

const tooltip =

    );

const tooltipPhoto =

    );

const tooltipRank =

    document.getElementById(

const tooltipIdentity =

   EDITOR MODE
===================================================== */

    new URLSearchParams(
        window.location.search

const editorMode =
    urlParams.get("edit") === "true";


let addingLine = false;

let firstLineStar = null;

let draggingStudent = null;

let hasDragged = false;

===================================================== */

/* =====================================================
   CREATE MONTH TABS
===================================================== */

function createMonthTabs() {

    const container =
        document.getElementById(
            "month-tabs"
        );


    container.innerHTML = "";


    const cycle =
        cycles[currentCycleIndex];


    cycle.months.forEach(
        (month, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "month-tab";


            button.textContent =
                month.substring(
                    0,
                    3
                ).toUpperCase();


            button.addEventListener(
                "click",
                () => {

                    currentMonthIndex =
                        index;

                    updateMonth();

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   UPDATE TAB ACTIVE STATE
===================================================== */

function updateMonthTabs() {

    const tabs =
        document.querySelectorAll(
            ".month-tab"
        );


    tabs.forEach(
        (tab, index) => {

            tab.classList.toggle(
                "active",
                index ===
                currentMonthIndex
            );

        }
    );

}


/* =====================================================
   TOOLTIP
===================================================== */

function showTooltip(
    student,
    event
) {

    tooltipName.textContent =
        student.name;


    tooltipIdentity.textContent =
        student.identity ||
        "Recorded star";


    if (
        student.rank > 0
    ) {

        tooltip.classList.remove(
            "simple"
        );

        tooltipPhoto.style.display =
            "block";

        tooltipPhoto.src =
            student.photo || "";

        tooltipRank.textContent =
            `Rank #${student.rank}`;

    } else {

        tooltip.classList.add(
            "simple"
        );

        tooltipPhoto.style.display =
            "none";

        tooltipRank.textContent =
            "Recorded Star";

    }


    positionTooltip(event);

    tooltip.classList.add(
        "visible"
    );

}


function positionTooltip(event) {

    const padding =
        15;

    let x =
        event.clientX + 16;

    let y =
        event.clientY + 16;


    const width =
        tooltip.offsetWidth ||
        230;

    const height =
        tooltip.offsetHeight ||
        150;


    if (
        x + width >
        window.innerWidth -
        padding
    ) {

        x =
            event.clientX -
            width -
            16;

    }


    if (
        y + height >
        window.innerHeight -
        padding
    ) {

        y =
            event.clientY -
            height -
            16;

    }


    tooltip.style.left =
        `${x}px`;

    tooltip.style.top =
        `${y}px`;

}


function hideTooltip() {

    tooltip.classList.remove(
        "visible"
    );

}


/* =====================================================
   SVG COORDINATE CONVERSION
===================================================== */

function getSVGPoint(event) {

    const point =
        svg.createSVGPoint();


    point.x =
        event.clientX;

    point.y =
        event.clientY;


    const matrix =
        svg.getScreenCTM();


    if (!matrix) {

        return {
            x: 0,
            y: 0
        };

    }


    return point.matrixTransform(
        matrix.inverse()
    );

}


/* =====================================================
   UPDATE STAR POSITION
===================================================== */

function updateStarPosition(
    student,
    event
) {

    const point =
        getSVGPoint(event);


    student.x =
        Math.max(
            20,
            Math.min(
                980,
                point.x
            )
        );


    student.y =
        Math.max(
            20,
            Math.min(
                542,
                point.y
            )
        );


    saveEditorData();

    drawConstellation();

}


/* =====================================================
   DRAW CONSTELLATION
===================================================== */

function drawConstellation() {

    svg.innerHTML = "";


    const cycle =
        cycles[currentCycleIndex];


    const month =
        cycle.months[
            currentMonthIndex
        ];


    const monthStudents =
        students.filter(
            student =>
                student.month === month
        );


    const empty =
        document.getElementById(
            "empty-month"
        );


    empty.style.display =
        monthStudents.length
            ? "none"
            : "flex";


    /*
       CONNECTIONS
    */

    const connections =
        constellationLines[
            month
        ] || [];


    connections.forEach(
        (connection, connectionIndex) => {

            const [
                indexA,
                indexB,
                major
            ] = connection;


            const studentA =
                students[indexA];

            const studentB =
                students[indexB];


            if (
                !studentA ||
                !studentB ||
                studentA.month !== month ||
                studentB.month !== month
            ) {

                return;

            }


            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            line.setAttribute(
                "x1",
                studentA.x
            );

            line.setAttribute(
                "y1",
                studentA.y
            );

            line.setAttribute(
                "x2",
                studentB.x
            );

            line.setAttribute(
                "y2",
                studentB.y
            );


            line.setAttribute(
                "class",
                major
                    ? "constellation-line major"
                    : "constellation-line"
            );


            /*
               DELETE LINE
            */

            if (editorMode) {

                line.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        if (addingLine) {

                            return;

                        }

                        constellationLines[
                            month
                        ].splice(
                            connectionIndex,
                            1
                        );


                        saveEditorData();

                        drawConstellation();

                        setEditorStatus(
                            "Line removed."
                        );

                    }
                );

            }


            svg.appendChild(
                line
            );

        }
    );


    /*
       STARS
    */

    monthStudents.forEach(
        student => {

            const group =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );


            group.setAttribute(
                "class",
                "star"
            );


            if (
                student.rank === 0
            ) {

                group.classList.add(
                    "recorded-star"
                );

            }


            group.style.color =
                student.color;


            group.setAttribute(
                "transform",
                `translate(${student.x}, ${student.y})`
            );


            /*
               GLOW
            */

            const glow =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            const glowRadius =
                student.rank === 1
                    ? 23
                    : student.rank === 2
                    ? 19
                    : student.rank === 3
                    ? 16
                    : 9;


            glow.setAttribute(
                "r",
                glowRadius
            );


            glow.setAttribute(
                "fill",
                student.color
            );


            glow.setAttribute(
                "opacity",
                student.rank
                    ? "0.15"
                    : "0.055"
            );


            glow.classList.add(
                "star-glow"
            );


            /*
               CORE
            */

            const core =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            const radius =
                student.rank === 1
                    ? 8.5
                    : student.rank === 2
                    ? 6.8
                    : student.rank === 3
                    ? 6
                    : 3.5;


            core.setAttribute(
                "r",
                radius
            );


            core.setAttribute(
                "fill",
                student.color
            );


            core.setAttribute(
                "stroke",
                "rgba(255,255,255,0.8)"
            );


            core.setAttribute(
                "stroke-width",
                student.rank
                    ? "1.2"
                    : "0.7"
            );


            core.classList.add(
                "star-core"
            );


            group.appendChild(
                glow
            );

            group.appendChild(
                core
            );


            /*
               FLARE
            */

            if (
                student.rank > 0
            ) {

                const flare =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "path"
                    );


                flare.setAttribute(
                    "d",
                    "M -17 0 L 17 0 M 0 -17 L 0 17"
                );


                flare.setAttribute(
                    "stroke",
                    student.color
                );


                flare.setAttribute(
                    "stroke-width",
                    "0.7"
                );


                flare.setAttribute(
                    "opacity",
                    "0.35"
                );


                flare.classList.add(
                    "star-flare"
                );


                group.appendChild(
                    flare
                );

            }


            /*
               HOVER TOOLTIP
            */

            group.addEventListener(
                "mouseenter",
                event => {

                    showTooltip(
                        student,
                        event
                    );

                }
            );


            group.addEventListener(
                "mousemove",
                event => {

                    positionTooltip(
                        event
                    );

                }
            );


            group.addEventListener(
                "mouseleave",
                hideTooltip
            );


            /*
               EDITOR DRAGGING
            */

            if (editorMode) {

                group.addEventListener(
                    "pointerdown",
                    event => {

                        if (
                            addingLine
                        ) {

                            return;

                        }


                        event.preventDefault();

                        event.stopPropagation();


                        draggingStudent =
                            student;

                        hasDragged =
                            false;


                        group.classList.add(
                            "dragging"
                        );


                        group.setPointerCapture(
                            event.pointerId
                        );

                    }
                );


                group.addEventListener(
                    "pointermove",
                    event => {

                        if (
                            draggingStudent !== student
                        ) {

                            return;

                        }


                        hasDragged =
                            true;


                        updateStarPosition(
                            student,
                            event
                        );

                    }
                );


                group.addEventListener(
                    "pointerup",
                    event => {

                        if (
                            draggingStudent !== student
                        ) {

                            return;

                        }


                        draggingStudent =
                            null;


                        group.classList.remove(
                            "dragging"
                        );


                        try {

                            group.releasePointerCapture(
                                event.pointerId
                            );

                        } catch {}

                    }
                );


                /*
                   ADD LINE
                */

                group.addEventListener(
                    "click",
                    event => {

                        if (
                            hasDragged
                        ) {

                            hasDragged =
                                false;

                            return;

                        }


                        if (
                            !addingLine
                        ) {

                            return;

                        }


                        event.stopPropagation();


                        handleLineSelection(
                            student,
                            group
                        );

                    }
                );

            }

            svg.appendChild(
                group
            );

        }
    );

}


/* =====================================================
   LINE CREATION
===================================================== */

function handleLineSelection(
    student,
    group
) {

    if (
        !firstLineStar
    ) {

        firstLineStar =
            student;


        group.classList.add(
            "selected-line-star"
        );


        setEditorStatus(
            `First star selected: ${student.name}. Now click the second star.`
        );


        return;

    }


    if (
        firstLineStar === student
    ) {

        setEditorStatus(
            "Choose a different second star."
        );


        return;

    }


    const month =
        cycles[
            currentCycleIndex
        ].months[
            currentMonthIndex
        ];


    if (
        !constellationLines[month]
    ) {

        constellationLines[month] =
            [];

    }


    const exists =
        constellationLines[month].some(
            connection => {

                const [
                    a,
                    b
                ] = connection;


                return (
                    (
                        a ===
                        students.indexOf(
                            firstLineStar
                        ) &&
                        b ===
                        students.indexOf(
                            student
                        )
                    )
                    ||
                    (
                        a ===
                        students.indexOf(
                            student
                        ) &&
                        b ===
                        students.indexOf(
                            firstLineStar
                        )
                    )
                );

            }
        );


    if (exists) {

        setEditorStatus(
            "Those two stars are already connected."
        );


        clearLineSelection();

        return;

    }


    constellationLines[month].push(

        [
            students.indexOf(
                firstLineStar
            ),

            students.indexOf(
                student
            ),

            false

        ]

    );


    saveEditorData();

    clearLineSelection();

    drawConstellation();

    setEditorStatus(
        "New constellation line created."
    );

}


/* =====================================================
   CLEAR LINE SELECTION
===================================================== */

function clearLineSelection() {

    document
        .querySelectorAll(
            ".selected-line-star"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "selected-line-star"
                );

            }
        );


    firstLineStar =
        null;

}

===================================================== */

document
    .getElementById(
        "reset-all"
    )
    .addEventListener(
        "click",
        () => {

            const confirmed =
                confirm(
                    "Reset ALL constellation positions and lines?"
                );


            if (!confirmed) {

                return;

            }


            students.forEach(
                (student, index) => {

                    student.x =
                        originalStudents[
                            index
                        ].x;

                    student.y =
                        originalStudents[
                            index
                        ].y;

                }
            );


            constellationLines =
                JSON.parse(
                    JSON.stringify(
                        originalLines
                    )
                );


            localStorage.removeItem(
                STORAGE_KEY
            );


            clearLineSelection();

            drawConstellation();

            setEditorStatus(
                "Everything has been reset."
            );

        }
    );

${students.map(

    }`

                );

                    );

                document.body.appendChild(

                );


                textarea.select();

/* =====================================================
   UPDATE MONTH
===================================================== */

function updateMonth() {

    const cycle =
        cycles[currentCycleIndex];


    const month =
        cycle.months[
            currentMonthIndex
        ];


    document.getElementById(
        "current-month"
    ).textContent =
        month.toUpperCase();


    document.getElementById(
        "month-corner"
    ).textContent =
        `${month} 2026`;


    const constellationNames = {

        June:
            "Summer Sky · Northern Hemisphere",

        July:
            "Summer Sky · Northern Hemisphere",

        August:
            "Late Summer Sky · Northern Hemisphere",

        September:
            "Early Autumn Sky · Northern Hemisphere",

        October:
            "Autumn Sky · Northern Hemisphere",

        November:
            "Late Autumn Sky · Northern Hemisphere"

    };


    document.getElementById(
        "constellation-name"
    ).textContent =
        constellationNames[
            month
        ] || "Celestial Sky";


    updateMonthTabs();

    drawConstellation();

    hideTooltip();

}


/* =====================================================
   UPDATE CYCLE
===================================================== */

function updateCycle() {

    const cycle =
        cycles[currentCycleIndex];


    document.getElementById(
        "cycle-name"
    ).textContent =
        cycle.name;


    document.getElementById(
        "cycle-date"
    ).textContent =
        cycle.date;


    currentMonthIndex = 0;


    createMonthTabs();

    updateMonth();

}


/* =====================================================
   PREVIOUS CYCLE
===================================================== */

document
    .getElementById(
        "previous"
    )
    .addEventListener(
        "click",
        () => {

            currentCycleIndex--;


            if (
                currentCycleIndex < 0
            ) {

                currentCycleIndex =
                    cycles.length - 1;

            }


            updateCycle();

        }
    );


/* =====================================================
   NEXT CYCLE
===================================================== */

document
    .getElementById(
        "next"
    )
    .addEventListener(
        "click",
        () => {

            currentCycleIndex++;


            if (
                currentCycleIndex >=
                cycles.length
            ) {

                currentCycleIndex = 0;

            }


            updateCycle();

        }
    );

   PROFILE
===================================================== */

        "profile-name"
    ).textContent =

    ).textContent =

        "profile-info"
    ).innerHTML =

        student.rank

        ? `

            Stellar Classification:

            <strong
                style="color:${student.color}">

                ${
                    student.rank === 1
                        ? "Blue Star"
                        : student.rank === 2
                        ? "Orange Star"
                        : "Red Star"
                }

            </strong>

            <br>

            Celestial Cycle I

        `

        :

        `

            ${student.identity ||
            "Recorded Star"}

            <br>

            Celestial Cycle I

        `;


    document.getElementById(
        "profile-quote"
    ).textContent =
        `“${student.quote}”`;


    const portrait =
        document.getElementById(
            "portrait"
        );


    portrait.innerHTML = "";


    if (
        student.rank > 0 &&
        student.photo
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            student.photo;


        image.alt =
            student.name;


        portrait.appendChild(

        );

        portrait.textContent =

    );

        if (
            event.key === "Escape"
        ) {

            modal.classList.remove(
                "active"
            );

            hideTooltip();

        }

    }
);


/* =====================================================
   LOAD SAVED EDITOR DATA
===================================================== */

loadEditorData();


/* =====================================================
   INITIALIZE
===================================================== */

createMonthTabs();

updateCycle();

</script>
